<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Morning Paper</title>
  <style>
    body { font-family: Georgia, serif; background: #faf7f0; color: #111; margin: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
    h1 { text-align: center; font-size: 2.6rem; border-bottom: 4px double #111;
         padding-bottom: 10px; margin-bottom: 4px; }
    .tag { text-align: center; font-style: italic; margin-bottom: 30px; }
    h3 { margin: 28px 0 10px; }
    input[type=text] { width: 100%; padding: 10px; font-size: 1rem;
         border: 1px solid #111; background: #fff; box-sizing: border-box; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chips input { display: none; }
    .chips span { display: inline-block; padding: 8px 16px; border: 1px solid #111;
         border-radius: 999px; cursor: pointer; user-select: none; }
    .chips input:checked + span { background: #111; color: #faf7f0; }
    select { padding: 10px; font-size: 1rem; }
    button { margin-top: 30px; width: 100%; padding: 14px; font-size: 1.1rem;
         background: #111; color: #faf7f0; border: 0; cursor: pointer; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>The Morning Paper</h1>
  <div class="tag">A newspaper that is only about you</div>
  <form method="post" action="/onboarding">
    <h3>What should we call you?</h3>
    <input type="text" name="name" placeholder="Your name" required>

    <h3>Pick what you care about</h3>
    <div class="chips">
      {% for t in topics %}
      <label><input type="checkbox" name="topics" value="{{ t }}"><span>{{ t }}</span></label>
      {% endfor %}
    </div>

    <h3>Anything specific? (optional, separate with commas)</h3>
    <input type="text" name="extra" placeholder="e.g. startups, formula 1, space">

    <h3>How long do you want to read?</h3>
    <select name="minutes">
      <option value="5">5 minutes</option>
      <option value="10" selected>10 minutes</option>
      <option value="15">15 minutes</option>
    </select>

    <button type="submit">Build my first paper</button>
  </form>
</div>
</body>
</html>
